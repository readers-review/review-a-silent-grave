<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Meta Refresh: Redirects immediately (0 seconds) -->
    <!-- When your book is live, swap [https://www.amazon.com/review/create-review?asin=YOUR_ASIN -->
    <meta http-equiv="refresh" content="0; url=https://www.amazon.com">
    
    <script>
        // JavaScript Fallback
        window.location.href = "https://www.amazon.com";
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://www.amazon.com">click here to continue to Amazon</a>.</p>
</body>
</html>
